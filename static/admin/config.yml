# Sveltia CMS. Served at https://shakthipalace.com/admin/, signs in through
# calculon.tech, the forge (which signs in through Vault), and commits to main.
backend:
  name: gitea
  repo: ananthb/shakthipalace.com
  branch: main
  base_url: https://calculon.tech
  api_root: https://calculon.tech/api/v1
  # Client id of the public OAuth2 app declared in calculon-tech/platform,
  # tf/forgejo/sites.tf (output sveltia_app_ids).
  app_id: bb1acf39-d296-4bdc-87b8-99881f0bb1b2
  # Vault is the only door: no personal-access-token sign-in.
  auth_methods: [oauth]

site_url: https://shakthipalace.com
display_url: https://shakthipalace.com

# Hugo page resources: the theme reads images from assets/ and front matter
# refers to them without a leading slash.
media_folder: assets/images
public_folder: images

# Photos are resized on the way in, so phone originals never reach the repo.
media_libraries:
  default:
    config:
      max_file_size: 20000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: home
    label: Home page
    files:
      - name: home
        label: Home page
        file: content/_index.md
        format: toml-frontmatter
        fields:
          - { name: title, label: Title, widget: string }
          - { name: heroHeading, label: Hero heading, widget: string }
          - { name: heroSubheading, label: Hero subheading, widget: text }
          - { name: heroLeftBackground, label: Hero left image, widget: image }
          - { name: heroRightBackground, label: Hero right image, widget: image }
          - { name: body, label: Body, widget: markdown, required: false }

  - name: homepage
    label: Home page strips
    label_singular: Strip
    folder: content/homepage
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    filter: { field: headless, value: null }
    sortable_fields:
      fields: [weight, title]
      default: { field: weight, direction: ascending }
    fields:
      # The filter above hides the section's own index.md (headless: true);
      # Sveltia wants the field declared to filter on it. Hidden: never edited.
      - { name: headless, widget: hidden, required: false }
      - { name: title, label: Title, widget: string }
      - { name: weight, label: Order, widget: number, value_type: int }
      - { name: background, label: Background image, widget: image }
      - { name: button, label: Button text, widget: string, required: false }
      - { name: buttonLink, label: Button link, widget: string, required: false, hint: "A path on this site (gallery) or a full URL" }
      - { name: body, label: Text, widget: markdown }

  - name: services
    label: Services
    label_singular: Service
    folder: content/services
    extension: md
    format: yaml-frontmatter
    create: true
    slug: "{{slug}}"
    filter: { field: headless, value: null }
    sortable_fields:
      fields: [weight, title]
      default: { field: weight, direction: ascending }
    fields:
      # The filter above hides the section's own index.md (headless: true);
      # Sveltia wants the field declared to filter on it. Hidden: never edited.
      - { name: headless, widget: hidden, required: false }
      - { name: title, label: Title, widget: string }
      - { name: weight, label: Order, widget: number, value_type: int }
      - { name: icon, label: Icon, widget: string, hint: "A Material Icons name, e.g. cake, restaurant, event" }
      - { name: link, label: Link, widget: string, required: false, hint: "A path on this site (mini-hall) or a full URL" }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Points, widget: markdown, hint: "One bullet per line" }

  - name: facilities
    label: Facilities
    label_singular: Facility
    folder: content/facilities
    extension: md
    format: toml-frontmatter
    create: true
    slug: "{{slug}}"
    sortable_fields:
      fields: [weight, title]
      default: { field: weight, direction: ascending }
    index_file:
      fields:
        - { name: _template, widget: hidden, default: facilities }
        - { name: title, label: Title, widget: string }
        - { name: heading, label: Heading, widget: string }
    fields:
      - { name: _template, widget: hidden, default: facilities }
      - { name: title, label: Title, widget: string }
      - { name: heading, label: Heading, widget: string }
      - { name: icon, label: Icon, widget: string, required: false, hint: "A Material Icons name, e.g. ac_unit, restaurant, elevator" }
      - { name: weight, label: Order, widget: number, value_type: int }
      - { name: draft, label: Draft, widget: boolean, default: false, required: false }
      - { name: images, label: Photos, widget: list, required: false, field: { name: image, label: Photo, widget: image } }
      - { name: body, label: Text, widget: markdown }

  - name: moments
    label: Moments
    label_singular: Moment
    description: A dated set of photos from an event. Title, date, drop the photos in, save.
    folder: content/moments
    path: "{{year}}/{{slug}}/index"
    media_folder: ""
    public_folder: ""
    extension: md
    format: toml-frontmatter
    create: true
    preview_path: "/moments/{{year}}/{{slug}}/"
    summary: "{{date | date('D MMM YYYY')}} · {{title}}"
    thumbnail: cover
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    fields:
      - { name: title, label: What was it, widget: string, hint: "e.g. Reception for the Krishnamurthy family" }
      - { name: date, label: When, widget: datetime, time_format: false, default: "{{now}}" }
      - { name: venue, label: Where, widget: select, required: false, options: [Grand Wedding Hall, Mini Hall, Rooftop, Shakthi Sangita Sabha] }
      - { name: cover, label: Cover photo, widget: image }
      - { name: photos, label: Photos, widget: image, multiple: true, max: 80 }
      - { name: body, label: A line or two, widget: markdown, required: false, minimal: true }
      - { name: draft, label: Draft, widget: boolean, default: false, required: false }
      # Older moments keep their photos under assets/images; never shown for new ones.
      - { name: images, widget: hidden, required: false }
      - { name: thumbnail, widget: hidden, required: false }
      - { name: aliases, widget: hidden, required: false }

  - name: kalyana_mandapam
    label: Kalyana Mandapam
    label_singular: Section
    folder: content/kalyana-mandapam
    extension: md
    format: toml-frontmatter
    create: true
    slug: "{{slug}}"
    sortable_fields:
      fields: [weight, title]
      default: { field: weight, direction: ascending }
    index_file:
      name: index
      label: Venue page
      fields:
        - { name: title, label: Title, widget: string }
        - { name: heroHeading, label: Hero heading, widget: string }
        - { name: type, widget: hidden, default: venue }
        - { name: date, widget: hidden, required: false }
        - { name: draft, label: Draft, widget: boolean, default: false, required: false }
        - { name: aliases, widget: hidden, required: false }
        - { name: body, label: Intro, widget: markdown, required: false, hint: "Keep the {{< strips >}} line: it places the sections" }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: weight, label: Order, widget: number, value_type: int }
      - { name: background, label: Background image, widget: image, required: false }
      - { name: features, label: At-a-glance chips, widget: list, required: false, hint: "Shown by {{< features >}} in the text" }
      - { name: rules, label: House rules chips, widget: list, required: false }
      - { name: body, label: Text, widget: markdown }

  - name: mini_hall
    label: Mini Hall
    label_singular: Section
    folder: content/mini-hall
    extension: md
    format: toml-frontmatter
    create: true
    slug: "{{slug}}"
    sortable_fields:
      fields: [weight, title]
      default: { field: weight, direction: ascending }
    index_file:
      name: index
      label: Venue page
      fields:
        - { name: title, label: Title, widget: string }
        - { name: heroHeading, label: Hero heading, widget: string }
        - { name: type, widget: hidden, default: venue }
        - { name: date, widget: hidden, required: false }
        - { name: draft, label: Draft, widget: boolean, default: false, required: false }
        - { name: aliases, widget: hidden, required: false }
        - { name: body, label: Intro, widget: markdown, required: false, hint: "Keep the {{< strips >}} line: it places the sections" }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: weight, label: Order, widget: number, value_type: int }
      - { name: background, label: Background image, widget: image, required: false }
      - { name: features, label: At-a-glance chips, widget: list, required: false, hint: "Shown by {{< features >}} in the text" }
      - { name: rules, label: House rules chips, widget: list, required: false }
      - { name: body, label: Text, widget: markdown }

