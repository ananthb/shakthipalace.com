baseURL = "https://shakthipalace.com/"
languageCode = "en-in"
title = "Shakthi Palace"
enableRobotsTXT = true
theme = "github.com/ananthb/mandapam-theme"

# Programmes are dated in the future; taxonomies have no templates.
buildFuture = true
disableKinds = ["taxonomy", "term"]

[module]
[[module.imports]]
path = "github.com/ananthb/mandapam-theme"

[params]
logo = "logos/shakthi-palace-logo-transparent.png"
hero_eyebrow = "சக்தி பேலஸ் · வளசரவாக்கம்"
hero_cta = "Check a date on WhatsApp"
hero_button = "See the venues"
hero_button_link = "#venues"
whatsapp_message = "Hi, I'd like to check availability at Shakthi Palace for "
services_kicker = "Under one roof"
services_heading = "The venues"
moments_kicker = "Moments"
moments_heading = "Recent events"
moments_all = "All moments"

# The lotus logo: plum and marigold.
[params.theme]
primary = "#5e2a63"
primary_deep = "#2e1533"
accent = "#f2a900"
ivory = "#fbf7ee"
ink = "#241b22"
positive = "#25714b"

[[params.facts]]
value = "500"
label = "seated · 1,000 floating"
[[params.facts]]
value = "2"
label = "dining halls, indoor and rooftop"
[[params.facts]]
value = "14"
label = "a/c guest rooms"
[[params.facts]]
value = "A/C"
label = "powerful air-conditioning"

[params.homepage_meta_tags]
meta_description = "Shakthi Palace is a fully air-conditioned kalyana mandapam, mini hall and music auditorium in Anbu Nagar, Valasaravakkam, Chennai, with guest rooms, rooftop dining, lifts and full power backup."
meta_og_title = "Shakthi Palace"
meta_og_type = "website"
meta_og_url = "https://shakthipalace.com/"

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Kalyana Mandapam"
url = "/kalyana-mandapam/"
weight = 2

[[menu.main]]
name = "Mini Hall"
url = "/mini-hall/"
weight = 3

[[menu.main]]
name = "Sangita Sabha"
url = "https://shakthisangitasabha.com"
weight = 4
[menu.main.params]
external = true

[[menu.main]]
name = "Facilities"
url = "/facilities/"
weight = 5

[[menu.main]]
name = "Moments"
url = "/moments/"
weight = 6

[[menu.main]]
name = "Contact"
url = "/#contact"
weight = 7

[permalinks]
moments = "/moments/:year/:slug/"

[imaging]
quality = 82
[imaging.exif]
includeFields = ""
disableLatLong = true
